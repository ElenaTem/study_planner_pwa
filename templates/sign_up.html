{% extends "base.html" %}
{% set show_full_navigation = false %}
{% set logo_links_home = false %}


{% block title %}Sign Up{% endblock %}


{% block head_scripts %}
    <script
        src="{{ url_for('static', filename='js/password_visibility.js') }}"
        defer
    ></script>
{% endblock %}


{% block content %}
    <div class="login_signup">
        <h1>Sign Up</h1>


        <div class="login_signup_box">
            <form action="{{ url_for('sign_up') }}" method="POST" autocomplete="off">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <br><br>
               
                <label for="user_email">Email:</label>
                <input type="email" id="user_email" name="user_email" required>
                <br><br>
               
                <label for="password">Password:</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        required
                    >




                    <button
                        type="button"
                        class="password-toggle"
                        data-password-toggle
                        data-target="password"
                        aria-label="Show password"
                        aria-pressed="false"
                        title="Show password"
                    >
                        <svg
                            class="password-eye-icon password-eye-open"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                            <circle cx="12" cy="12" r="2.75"></circle>
                        </svg>




                        <svg
                            class="password-eye-icon password-eye-closed"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                            hidden
                        >
                            <path d="M3 3l18 18"></path>
                            <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16.2 16.2 0 0 1-3.1 3.7"></path>
                            <path d="M6.1 6.1C3.8 7.7 2.5 12 2.5 12s3.5 6 9.5 6a9.9 9.9 0 0 0 4-.8"></path>
                            <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1"></path>
                        </svg>
                    </button>
                </div>
                <br><br>


                <button type="submit" class="login-button">Sign Up</button>


                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}


                <p class="small_text">Have an account? <a href="{{ url_for('login') }}">Login</a></p>
            </form>
        </div>




    </div>
{% endblock %}
